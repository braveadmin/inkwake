name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r firmware/requirements.txt
      - run: pio run -d firmware -e device
      - run: sudo apt-get update && sudo apt-get install -y openscad && make -C enclosure
      - name: Upload release assets
        run: |
          b=firmware/.pio/build/device
          cp $b/firmware.bin "inkwake-${TAG}.bin"
          sha256sum "inkwake-${TAG}.bin" enclosure/build/*.stl > SHA256SUMS
          gh release upload "$TAG" "inkwake-${TAG}.bin" enclosure/build/*.stl SHA256SUMS --clobber

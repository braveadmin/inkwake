name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r firmware/requirements.txt
      - run: pio run -d firmware -e device
      # Enclosure STLs stay out of releases until the case is measured and
      # test-printed (S1/S3); enclosure.yml still builds them as CI artifacts.
      - name: Upload release assets
        run: |
          # Fresh install: 0x0 bootloader, 0x8000 partitions, 0x10000 firmware.
          # Update: firmware at 0x10000 only, no erase (keeps settings).
          b=firmware/.pio/build/device
          cp $b/firmware.bin "inkwake-${TAG}.bin"
          cp $b/bootloader.bin "inkwake-${TAG}-bootloader.bin"
          cp $b/partitions.bin "inkwake-${TAG}-partitions.bin"
          files="inkwake-${TAG}.bin inkwake-${TAG}-bootloader.bin inkwake-${TAG}-partitions.bin"
          sha256sum $files > SHA256SUMS
          gh release upload "$TAG" $files SHA256SUMS --clobber

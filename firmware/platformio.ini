; inkwake firmware
; Device target: Waveshare ESP32-S3-RLCD-4.2 (ADR-0002).

[platformio]
default_envs = device

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; Waveshare ESP32-S3-RLCD-4.2 (ESP32-S3-WROOM-1-N16R8). Pin map: hardware/wiring.md.
; Arduino-ESP32 3.x needs the pioarduino platform; pin a release tag in M1.
[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi  ; WROOM-1 N16R8 = octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; Display (ST7305) and UI library chosen at M0, LVGL a candidate (ADR-0004).

; M0 hardware spike: throwaway test firmware, see docs/m0-spike.md. Deleted after M2.
[env:spike]
extends = env:device
build_src_filter = -<*> +<../spike/>
lib_deps = SPI

; Host build: unit tests for lib/alarm_core (and later widgets, config).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>

; inkwake firmware
; Device target is provisional until the M0 board gate (ADR-002).

[platformio]
default_envs = paper_s3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; ESP32-S3 all-in-one touch e-ink board (M5Stack PaperS3 candidate).
; Arduino-ESP32 3.x needs the pioarduino platform; pin a release tag in M1.
[env:paper_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; Display/touch driver added at M0 once the board is confirmed, e.g.
; lib_deps = m5stack/M5Unified

; Host build: unit tests for lib/alarm_core (and later widgets, config).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>

name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: firmware

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      # lib/qrcodegen is vendored as is (Nayuki, MIT): not reformatted.
      - run: find src lib test spike -path lib/qrcodegen -prune -o \( -name '*.cpp' -o -name '*.h' \) -print | xargs clang-format --dry-run --Werror
      - name: web page header matches web/index.html
        run: python3 tools/gen_web.py --check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install -r requirements.txt
      - run: pio test -e native

  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-s3-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install -r requirements.txt
      - run: pio run -e device
      - run: pio run -e spike
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/.pio/build/device/firmware.bin
            firmware/.pio/build/device/bootloader.bin
            firmware/.pio/build/device/partitions.bin
      - uses: actions/upload-artifact@v4
        with:
          name: spike-${{ github.sha }}
          path: |
            firmware/.pio/build/spike/firmware.bin
            firmware/.pio/build/spike/bootloader.bin
            firmware/.pio/build/spike/partitions.bin

; inkwake firmware
; Device target: Waveshare ESP32-S3-RLCD-4.2 (ADR-0002).

[platformio]
default_envs = device

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; Waveshare ESP32-S3-RLCD-4.2 (ESP32-S3-WROOM-1-N16R8). Pin map: hardware/wiring.md.
; Arduino-ESP32 3.x needs the pioarduino platform, pinned to release 55.03.313
; (Arduino-ESP32 3.3.13, ESP-IDF 5.5) for reproducible builds. To upgrade, change
; the tag in the URL to a newer pioarduino release and verify on the board.
[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi  ; WROOM-1 N16R8 = octal PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; Display: own ST7305 driver (src/st7305.*) and framebuffer/fonts in lib/display, no LVGL (ADR-0004).

; M0 hardware spike: throwaway test firmware, see docs/m0-spike.md. Deleted after M2.
[env:spike]
extends = env:device
build_src_filter = -<*> +<../spike/>
lib_deps = SPI, Preferences

; Host build: unit tests for lib/alarm_core and lib/display (and later widgets, config).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>

; inkwake firmware
; Device target is provisional until the M0 board gate (ADR-002).

[platformio]
default_envs = device

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; Low-power ESP32-S3 N16R8 board (FeatherS3 or FireBeetle 2 S3, picked at M0).
; Generic S3 board definition until then; swap for the board's own id at M0.
; Arduino-ESP32 3.x needs the pioarduino platform; pin a release tag in M1.
[env:device]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi  ; octal PSRAM (FireBeetle 2 N16R8); FeatherS3 is quad: qio_qspi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; Display driver added at M0:
; lib_deps = zinggjm/GxEPD2

; Host build: unit tests for lib/alarm_core (and later widgets, config).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
